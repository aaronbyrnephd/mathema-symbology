[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mathema-symbology"
version = "0.1.0"
description = "Symbol lookups for mathema claim rendering."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Aaron Byrne", email = "contact@aaronbyrnephd.com" }]
keywords = ["mathema", "symbols", "notation", "greek"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8", "mathema"]

[project.urls]
Homepage = "https://github.com/aaronbyrnephd/mathema-symbology"
Issues = "https://github.com/aaronbyrnephd/mathema-symbology/issues"

[project.entry-points."mathema.capabilities"]
symbology = "mathema_symbology"

[tool.hatch.build.targets.wheel]
packages = ["src/mathema_symbology"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
strict = true
