[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mathema-symbology"
dynamic = ["version"]
description = "Standard notation for mathema's claim rendering: the symbols used in physics, chemistry, statistics, machine learning and finance, overridable per project."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Aaron Byrne", email = "contact@aaronbyrnephd.com" }]
keywords = ["mathema", "symbology", "mathematical-notation", "notation", "symbols",
            "unicode", "claim-driven-development"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8", "mathema>=0.6"]

[project.urls]
Homepage = "https://github.com/aaronbyrnephd/mathema-symbology"
Source = "https://github.com/aaronbyrnephd/mathema-symbology"
Documentation = "https://mathema.tetrionlabs.com/symbology/"
Issues = "https://github.com/aaronbyrnephd/mathema-symbology/issues"

[project.entry-points."mathema.capabilities"]
symbology = "mathema_symbology"

[tool.hatch.version]
path = "src/mathema_symbology/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mathema_symbology"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
strict = true
