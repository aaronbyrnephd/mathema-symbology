name: tests

on:
  push:
  pull_request:

jobs:
  standalone:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install . pytest ruff mypy types-PyYAML
      - run: ruff check .
      - run: mypy src
      - run: pytest -v

  integration:
    runs-on: ubuntu-latest
    # mathema is not on PyPI yet; drop continue-on-error once it
    # installs cleanly from there
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[test]"
      - run: pytest -v
